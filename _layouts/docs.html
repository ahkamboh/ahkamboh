<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ page.title | default: "Notes" }}</title>
    <style>
      :root {
        --text: #1a1a1a;
        --muted: #525252;
        --border: #e4e4e7;
        --surface: #fafafa;
        --accent: #0969da;
        --code-bg: #f4f4f5;
      }
      * { box-sizing: border-box; }
      body {
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        max-width: 780px;
        margin: 0 auto;
        padding: 2.5rem 1.5rem 5rem;
        line-height: 1.6;
        color: var(--text);
        font-size: 16px;
      }
      h1 {
        font-size: 1.85rem;
        font-weight: 700;
        letter-spacing: -0.02em;
        line-height: 1.2;
        margin: 0 0 0.75rem;
      }
      h2 {
        font-size: 1.05rem;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: #111;
        margin: 2.25rem 0 0.85rem;
        padding-bottom: 0.45rem;
        border-bottom: 2px solid #111;
      }
      h3 {
        font-size: 1rem;
        font-weight: 600;
        margin: 1.25rem 0 0.5rem;
      }
      p { margin: 0 0 1rem; }
      ul, ol { margin: 0 0 1rem; padding-left: 1.35rem; }
      li { margin: 0.25rem 0; }
      li > ul, li > ol { margin-top: 0.35rem; }
      a { color: var(--accent); text-decoration: none; }
      a:hover { text-decoration: underline; }
      strong { font-weight: 600; }
      hr {
        border: none;
        border-top: 1px solid var(--border);
        margin: 1.75rem 0;
      }
      blockquote {
        margin: 1rem 0 1.25rem;
        padding: 0.85rem 1rem;
        background: var(--surface);
        border-left: 4px solid #111;
        color: #333;
      }
      blockquote p:last-child { margin-bottom: 0; }
      code {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 0.88em;
        background: var(--code-bg);
        padding: 0.12em 0.35em;
        border-radius: 4px;
      }
      pre {
        overflow-x: auto;
        background: var(--code-bg);
        padding: 1rem 1.1rem;
        border-radius: 8px;
        border: 1px solid var(--border);
        margin: 1rem 0 1.25rem;
      }
      pre code {
        background: none;
        padding: 0;
        font-size: 0.82rem;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        margin: 1rem 0 1.25rem;
        font-size: 0.92rem;
      }
      thead th {
        text-align: left;
        background: #111;
        color: #fff;
        font-weight: 600;
        padding: 0.55rem 0.75rem;
      }
      tbody td {
        padding: 0.55rem 0.75rem;
        border-bottom: 1px solid var(--border);
        vertical-align: top;
      }
      tbody tr:nth-child(even) td { background: var(--surface); }
      .adr-meta {
        display: grid;
        grid-template-columns: 9rem 1fr;
        gap: 0.35rem 1rem;
        margin: 1.25rem 0 1.5rem;
        padding: 1rem 1.1rem;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 8px;
        font-size: 0.92rem;
      }
      .adr-meta dt {
        font-weight: 600;
        color: var(--muted);
        margin: 0;
      }
      .adr-meta dd {
        margin: 0;
      }
      .status-pill {
        display: inline-block;
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        background: #111;
        color: #fff;
        padding: 0.2rem 0.55rem;
        border-radius: 4px;
        vertical-align: middle;
        margin-left: 0.5rem;
      }
      .lede {
        font-size: 1.05rem;
        color: #333;
        margin-bottom: 1rem;
      }
      .mermaid {
        margin: 1.25rem 0 1.5rem;
        text-align: center;
        background: #fff;
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 1.25rem 1rem;
      }
      .two-col-good-bad {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 1rem;
        margin: 1rem 0 1.25rem;
      }
      .two-col-good-bad h3 {
        margin-top: 0;
        font-size: 0.85rem;
        text-transform: uppercase;
        letter-spacing: 0.06em;
      }
      .two-col-good-bad > div {
        padding: 0.85rem 1rem;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--surface);
      }
      @media (max-width: 640px) {
        .two-col-good-bad { grid-template-columns: 1fr; }
        .adr-meta { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    {{ content }}
    <script type="module">
      import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs";
      mermaid.initialize({
        startOnLoad: false,
        theme: "neutral",
        securityLevel: "strict",
      });
      const nodes = document.querySelectorAll(
        "pre code.language-mermaid, .language-mermaid pre code, code.language-mermaid"
      );
      for (const code of nodes) {
        const host =
          code.closest(".highlighter-rouge") ||
          code.closest("pre") ||
          code;
        const div = document.createElement("div");
        div.className = "mermaid";
        div.textContent = code.textContent;
        host.replaceWith(div);
      }
      await mermaid.run({ querySelector: ".mermaid" });
    </script>
  </body>
</html>
